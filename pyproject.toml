[project]
name = "weather-alerts-mcp-server"
version = "0.2.0"
description = "MCP server that returns US weather alerts and forecasts from the National Weather Service API"
readme = "README.md"
authors = [
    { name = "Hamed Ghaseminezhad", email = "101051231+Hamed-Ghaseminezhad@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.28,<1",
]

[project.scripts]
weather-alerts-mcp-server = "weather_alerts_mcp_server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
